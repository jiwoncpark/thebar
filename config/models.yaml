models:
  local_qwen:
    provider: ollama
    model: qwen3.5:9b
    base_url: http://localhost:11434/v1
    context_tokens: 16384   # must match OLLAMA_CONTEXT_LENGTH used to start Ollama
    temperature: 0.7

  # Example API model. Set an agent's `model:` to this name to use it.
  api_example:
    provider: openai
    model: gpt-5-mini
    api_key_env: OPENAI_API_KEY
    context_tokens: 128000

default: local_qwen
