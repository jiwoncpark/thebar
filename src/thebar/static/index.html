<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>thebar — research society</title>
<style>
  body { font: 14px/1.45 -apple-system, system-ui, sans-serif; margin: 0; color: #222; background: #fafafa; }
  header { background: #222; color: #eee; padding: 8px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header b { margin-right: 8px; }
  header a { color: #ccc; cursor: pointer; }
  header a.on { color: #fff; text-decoration: underline; }
  main { padding: 16px; max-width: 1100px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; margin: 8px 0; }
  .meta { color: #777; font-size: 12px; }
  pre { white-space: pre-wrap; word-wrap: break-word; margin: 6px 0; font: 13px/1.4 ui-monospace, monospace; }
  .ref { color: #0645ad; cursor: pointer; text-decoration: underline; }
  button { margin-right: 4px; }
  select, input, textarea { font: inherit; }
  textarea { width: 100%; height: 420px; font-family: ui-monospace, monospace; font-size: 13px; }
  .row { display: flex; gap: 12px; } .row > * { flex: 1; }
  /* Popup sits above the timeline cards and headers; the shadow dims the page behind it. */
  #modal { position: fixed; inset: 5% 10%; z-index: 100; background: #fff; border: 1px solid #999; padding: 12px; overflow: auto; display: none; box-shadow: 0 0 0 100vmax #0006, 0 4px 30px #0004; }
  .t-update, .t-post, .t-dm { border-left: 4px solid #2a7; }
  .t-tool_call, .t-tool_result { border-left: 4px solid #bbb; }
  .t-insight, .t-proposal, .t-experiment, .t-paper_notes { border-left: 4px solid #a5f; }
  .t-activity_ended { border-left: 4px solid #f90; }
  /* Timeline: one column per agent, items ordered by time, lines for references. */
  main.wide { max-width: none; }
  #tl { position: relative; }
  .tl-grid { display: grid; gap: 10px 28px; align-items: start; }
  .tl-head { position: sticky; top: 0; z-index: 3; background: #fafafa; font-weight: 600; padding: 4px 0; border-bottom: 2px solid #ccc; }
  .node { position: relative; z-index: 2; background: #fff; border: 1px solid #ddd; border-left: 5px solid var(--c); border-radius: 6px;
          padding: 6px 8px; font-size: 12.5px; cursor: pointer; box-shadow: 0 1px 2px #0001; }
  .node:hover, .node.lit { box-shadow: 0 0 0 2px var(--c); }
  .node .kind { display: inline-block; background: var(--c); color: #fff; border-radius: 3px; padding: 0 5px; font-size: 11px; margin-right: 4px; }
  .node .txt { color: #444; margin-top: 3px; max-height: 5.8em; overflow: hidden; white-space: pre-wrap; }
  .node.k-activity { background: #f6f6f6; }
  .chip { display: inline-block; font-size: 10.5px; background: #e8e8e8; border-radius: 8px; padding: 0 6px; margin: 2px 2px 0 0; }
  #tlsvg { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; overflow: visible; }
  #tlsvg .edge { fill: none; stroke-width: 1.6; opacity: .75; }
  #tlsvg.focus .edge, #tlsvg.focus .band { opacity: .08; }
  #tlsvg.focus .edge.on { opacity: 1; stroke-width: 2.6; }
  .legend span { display: inline-block; margin-right: 12px; font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 4px; }
</style>
</head>
<body>
<header>
  <b>thebar</b>
  <span id="tabs"></span>
  <span>run: <select id="run"></select></span>
</header>
<main id="main"></main>
<div id="modal"><button onclick="closeModal()">close</button> <button id="back" onclick="back()">← back</button><div id="modalBody"></div></div>
<script>
const TABS = ['timeline', 'runs', 'feed', 'boards', 'dms', 'agents', 'papers', 'artifacts', 'experiments', 'config', 'status'];
let tab = location.hash.slice(1) || 'timeline';
let runId = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Escape text and make references like paper:3 or proposal:2@1 clickable.
const linkify = (s) => esc(s).replace(/\b(paper|insight|proposal|message|experiment):(\d+)(@\d+)?/g,
  (m) => `<span class="ref" onclick="openRef('${m}')">${m}</span>`);
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  const body = await r.json();
  if (!r.ok) { alert(body.detail || r.statusText); throw new Error(body.detail); }
  return body;
};
const post = (path, body) => api(path, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body || {})});
// The popup keeps a history so you can click through (update → activity → paper → notes) and go back.
let modalHistory = [];
const show = (html) => {
  if ($('#modal').style.display === 'block') modalHistory.push($('#modalBody').innerHTML);
  $('#modalBody').innerHTML = html;
  $('#modal').style.display = 'block';
  $('#back').style.display = modalHistory.length ? '' : 'none';
};
function back() { $('#modalBody').innerHTML = modalHistory.pop(); $('#back').style.display = modalHistory.length ? '' : 'none'; }
function closeModal() { $('#modal').style.display = 'none'; modalHistory = []; }
document.addEventListener('keydown', (e) => e.key === 'Escape' && closeModal());
async function openRef(ref, extra = '') {
  const r = await api('/api/ref/' + ref);
  const pdf = ref.startsWith('paper:') ? ` <a href="/api/papers/${ref.split(':')[1]}/pdf" target="_blank">open PDF</a>` : '';
  show(`<h3>${esc(ref)}${pdf}</h3>${extra}${plots(r.images)}<pre>${linkify(r.text)}</pre>`);
}
const isImage = (path) => /\.(png|jpe?g|svg)$/i.test(path);
const fileUrl = (path) => '/api/file?path=' + encodeURIComponent(path);
// Plots with their captions; click a plot to see it full size.
const plots = (images) => (images || []).map(im => `<figure style="margin:8px 0">
  <img src="${fileUrl(im.path)}" style="max-width:100%;cursor:zoom-in;border:1px solid #ddd" onclick="openFile('${esc(im.path)}')">
  <figcaption class="meta" style="white-space:pre-wrap">${im.caption ? linkify(im.caption) : '<i>no caption</i>'}</figcaption></figure>`).join('');
async function openFile(path, extra = '') {
  if (isImage(path)) return show(`<h3>${esc(path)}</h3>${extra}<img src="${fileUrl(path)}" style="max-width:100%">`);
  const r = await api(fileUrl(path));
  show(`<h3>${esc(path)}</h3>${extra}<pre>${linkify(r.text)}</pre>`);
}
const fileLink = (path) => `<span class="ref" onclick="openFile('${esc(path)}')">${esc(path)}</span>`;

$('#tabs').innerHTML = TABS.map(t => `<a data-t="${t}">${t}</a>`).join(' ');
$('#tabs').onclick = (e) => { if (e.target.dataset.t) { location.hash = e.target.dataset.t; } };
window.onhashchange = () => { tab = location.hash.slice(1) || 'timeline'; render(); };
$('#run').onchange = () => { runId = +$('#run').value; render(); };

async function loadRuns() {
  const runs = await api('/api/runs');
  if (!runId && runs.length) runId = runs[0].id;
  $('#run').innerHTML = runs.map(r => `<option value="${r.id}" ${r.id === runId ? 'selected' : ''}>#${r.id} ${r.status}</option>`).join('');
  return runs;
}

const views = {
  async timeline() {
    if (!runId) return 'No run yet. Create one in the runs tab.';
    const t = await api(`/api/runs/${runId}/timeline`);
    TL = t;
    const cols = ['literature', ...t.agents];
    // Pack items into rows in time order. An item shares a row with the previous ones
    // only if its column is still free in that row, so reading top to bottom follows time.
    let row = 2, used = new Set();
    const placed = t.nodes.map(n => {
      const col = Math.max(0, cols.indexOf(n.agent)) + 1;
      if (used.has(col)) { row++; used = new Set(); }
      used.add(col);
      return {n, row, col};
    });
    const legend = '<div class="legend">' + Object.entries(KIND).map(([k, c]) => `<span><i style="--c:${c}"></i>${k}</span>`).join('') +
      '<span>── cites</span><span>- - reply / revision</span><span class="meta">hover a card to highlight its links; click to open</span></div>';
    return legend + `<div id="tl"><svg id="tlsvg"></svg><div class="tl-grid" style="grid-template-columns: 200px repeat(${t.agents.length}, minmax(260px, 1fr))">` +
      cols.map((c, i) => `<div class="tl-head" style="grid-row:1;grid-column:${i + 1}">${esc(c)}</div>`).join('') +
      placed.map(({n, row, col}) => nodeCard(n, row, col)).join('') + '</div></div>';
  },
  async runs() {
    const runs = await loadRuns();
    const control = (r, a) => `<button onclick="post('/api/runs/${r.id}/${a}').then(render)">${a}</button>`;
    return `<div class="card"><b>New run</b><br>
      <input id="q" style="width:80%" placeholder="Research question (blank = config/society.yaml)">
      <button onclick="post('/api/runs', {question: $('#q').value || null}).then(r => { runId = r.id; render(); })">create</button></div>` +
      runs.map(r => `<div class="card"><b>#${r.id}</b> [${r.status}] ${esc(r.question)}
        <div class="meta">agents: ${r.agents.join(', ')} · created ${r.created_at} · started ${r.started_at || '-'} · ended ${r.ended_at || '-'}</div>
        <div class="meta">last activity: ${r.last_activity ? `${r.last_activity.agent_id} ${r.last_activity.status} ${r.last_activity.started_at}` : '-'}
          · newest artifact: ${r.newest_artifact ? linkify(`${r.newest_artifact.kind}:${r.newest_artifact.id}`) + ' ' + esc(r.newest_artifact.title) : '-'}</div>
        ${['start', 'pause', 'resume', 'stop'].map(a => control(r, a)).join('')}</div>`).join('');
  },
  async feed() {
    const types = ['', 'update', 'post', 'dm', 'tool_call', 'tool_result', 'paper_read', 'paper_notes', 'insight', 'proposal', 'experiment', 'activity_started', 'activity_ended', 'run_status'];
    const f = window.feedFilter || {agent: '', type: ''};
    const events = (await api(`/api/events?run_id=${runId || ''}&newest=300`)).reverse()
      .filter(e => (!f.agent || e.agent_id === f.agent) && (!f.type || e.type === f.type));
    return `<div>agent <input size=8 value="${esc(f.agent)}" onchange="feedFilter={...(window.feedFilter||{type:''}), agent:this.value}; render()">
      type <select onchange="feedFilter={...(window.feedFilter||{agent:''}), type:this.value}; render()">${types.map(t => `<option ${t === f.type ? 'selected' : ''}>${t}</option>`).join('')}</select></div>` +
      events.map(e => `<div class="card t-${e.type}"><div class="meta">#${e.id} ${e.created_at} · <b>${e.agent_id || 'system'}</b> · ${e.type}
        ${e.activity_id ? '· activity ' + e.activity_id : ''} ${e.type === 'activity_started' ? `<button onclick="post('/api/activities/${e.activity_id}/cancel')">cancel</button>` : ''}</div>
        <pre>${linkify(summarize(e))}</pre></div>`).join('');
  },
  async boards() {
    if (!runId) return 'No run.';
    const threads = await api(`/api/runs/${runId}/threads`);
    let html = threads.map(t => `<div class="card"><a class="ref" onclick="openThread(${t.id})">${esc(t.title)}</a>
      <div class="meta">by ${t.author} · ${t.messages} messages · last ${t.last_post || '-'}</div></div>`).join('');
    return html + `<div class="card"><input id="sq" placeholder="search messages, notes, insights, proposals"> <button onclick="doSearch()">search</button><div id="sr"></div></div>`;
  },
  async dms() {
    if (!runId) return 'No run.';
    const msgs = await api(`/api/runs/${runId}/dms`);
    return msgs.map(m => `<div class="card t-dm"><div class="meta">message:${m.id} · ${m.author} → ${m.recipient} · ${m.created_at}</div><pre>${linkify(m.body)}</pre></div>`).join('') || 'No direct messages yet.';
  },
  async agents() {
    const agents = await api('/api/agents');
    const run = runId ? await api(`/api/runs/${runId}`) : {agents: []};
    return agents.map(a => {
      const s = run.agents.find(x => x.id === a.id);
      return `<div class="card"><h3>${esc(a.name)} <span class="meta">(${a.id}) ${a.enabled ? '' : 'disabled'}</span></h3>
        <div class="meta">model ${a.model}: ${esc(JSON.stringify(a.model_config))}</div>
        <div class="meta">prompt <span class="ref" onclick="openFile('${a.identity_prompt}')">${a.identity_prompt}</span> · papers ${a.papers_dir} · workspace ${a.workspace}</div>
        ${s ? `<p>status: ${s.paused ? 'paused' : s.busy ? 'working' : 'idle'} · next activity ${s.next_activity || '-'} · actual interval ${s.actual_interval_minutes ?? '-'} min
          <button onclick="post('/api/runs/${runId}/agents/${a.id}/pause').then(render)">pause</button>
          <button onclick="post('/api/runs/${runId}/agents/${a.id}/resume').then(render)">resume</button>
          <button onclick="post('/api/runs/${runId}/agents/${a.id}/wake').then(render)">wake now</button></p>
          <b>Recent activities</b>${s.activities.map(x => `<div class="meta">#${x.id} ${x.trigger} ${x.status} ${x.started_at} → ${x.ended_at || ''} ${esc(x.error || '')} prompt ${x.prompt_hash}</div>`).join('')}` : ''}
        <b>Memory</b><pre>${linkify(a.memory || '(empty)')}</pre>
        <b>Tools</b> ${a.tools.map(t => `<span class="ref" onclick="openFile('${t}')">${esc(t)}</span>`).join(' ') || '(none)'}</div>`;
    }).join('');
  },
  async papers() {
    const papers = await api('/api/papers');
    return papers.map(p => `<div class="card"><b>${linkify('paper:' + p.id)}</b> ${esc(p.title)}
      <div class="meta">${esc(p.authors)} ${p.year || ''} · ${p.collection} · arXiv ${p.arxiv_id || '-'} · doi ${esc(p.doi || '-')} · ${p.url ? `<a href="${esc(p.url)}">source</a>` : ''}
      <a href="/api/papers/${p.id}/pdf" target="_blank">pdf</a> · reads: ${p.reads.map(r => r.agent_id + '=' + r.status).join(', ') || 'none'}</div>
      ${p.notes_path ? `<span class="ref" onclick="openFile('${p.notes_path}')">notes</span>` : ''}</div>`).join('');
  },
  async artifacts() {
    const arts = await api('/api/artifacts');
    return arts.map(a => `<div class="card"><b>${linkify(a.kind + ':' + a.id)}</b> ${esc(a.title)}
      <div class="meta">by ${a.author} · revision ${a.revision} ${a.forked_from ? '· forked from ' + a.kind + ':' + a.forked_from : ''} · ${a.path}</div>
      <button onclick="openArtifact(${a.id})">history</button></div>`).join('') || 'No insights or proposals yet.';
  },
  async experiments() {
    const exps = await api('/api/experiments');
    const calls = await api('/api/tool_calls?limit=40');
    return '<h3>Experiments</h3>' + (exps.map(e => `<div class="card t-experiment"><b>${linkify('experiment:' + e.id)}</b> by ${e.author} · exit ${e.exit_code} · ${e.created_at}
      <div>${esc(e.hypothesis)}</div><div class="meta">${e.files.map(f => `<span class="ref" onclick="openFile('${e.path}/${f}')">${f}</span>`).join(' ')}</div>
      ${plots(e.images)}
      <pre>${esc(e.results || '')}</pre></div>`).join('') || 'None yet.') +
      '<h3>Recent tool calls</h3>' + calls.map(c => `<div class="card t-tool_call"><div class="meta">${c.agent_id} · activity ${c.activity_id} · ${c.tool} · ${c.started_at}</div>
      <pre>${esc((c.args || '').slice(0, 1500))}</pre><details><summary>result</summary><pre>${esc(c.result || '')}</pre></details></div>`).join('');
  },
  async config() {
    const cfg = await api('/api/config');
    return `<div class="row"><div><select id="cf" onchange="loadConfig()">${cfg.files.map(f => `<option>${f}</option>`).join('')}</select>
      <button onclick="saveConfig()">save</button><div class="meta">Changes apply to the next activity. Earlier text is kept in history.</div>
      <textarea id="ct"></textarea></div></div>
      <b>Edit history</b>${cfg.history.map(h => `<div class="meta">${h.created_at} ${h.path}</div>`).join('')}`;
  },
  async status() {
    return `<pre>${esc(JSON.stringify(await api('/api/status'), null, 2))}</pre>`;
  },
};

// ---- Timeline drawing ----
const KIND = {activity: '#999', update: '#2a9d8f', post: '#3a86ff', dm: '#8338ec', paper: '#9c6644', notes: '#d4a017',
              insight: '#f3722c', proposal: '#e63946', experiment: '#06a77d'};
const STATUS = {running: '#3a86ff', completed: '#2a9d8f', failed: '#e63946', canceled: '#999', timed_out: '#f3722c', interrupted: '#999'};
let TL = null;
const hhmm = (iso) => new Date(iso).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});

function nodeCard(n, row, col) {
  const c = n.kind === 'activity' ? (STATUS[n.status] || '#999') : KIND[n.kind];
  let body = '';
  if (n.kind === 'activity') {
    const mins = n.ended_at ? Math.round((new Date(n.ended_at) - new Date(n.time)) / 60000) + ' min' : 'working…';
    body = `<div class="meta">${n.status} · ${n.trigger} · ${mins}</div>` +
      (n.tools.length ? `<div>${n.tools.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : '') +
      (n.text ? `<div class="txt" style="color:#b00">${esc(n.text)}</div>` : '');
  } else {
    const extra = n.revision > 1 ? ` · revision ${n.revision}` : n.kind === 'experiment' ? ` · exit ${n.exit_code}` : '';
    body = `<div class="txt">${linkify((n.text || '').slice(0, 400))}</div><div class="meta">${n.key.split('@')[0]}${extra}</div>`;
    if (n.images && n.images.length) body += `<img src="${fileUrl(n.images[0].path)}" style="width:100%;margin-top:4px">`;
  }
  return `<div class="node k-${n.kind}" data-key="${esc(n.key)}" style="--c:${c};grid-row:${row};grid-column:${col}"
    onclick="openNode('${esc(n.key)}')" onmouseenter="focusNode('${esc(n.key)}')" onmouseleave="focusNode(null)">
    <span class="kind">${n.kind}</span><b>${esc(n.title || '')}</b> <span class="meta">${hhmm(n.time)}</span>${body}</div>`;
}

function openNode(key) {
  const n = TL.nodes.find(x => x.key === key);
  // Updates and activities open the activity that produced them; other items open the item itself.
  if (n.kind === 'activity' || (n.kind === 'update' && n.activity)) return openActivity(n.activity);
  const from = n.activity ? `<p class="meta">made by ${esc(n.agent)} in <span class="ref" onclick="openActivity(${n.activity})">activity #${n.activity}</span></p>` : '';
  if (n.kind === 'notes') openFile(n.path, from);
  else openRef(key, from);
}

// One line per tool call, saying what it did, with links to what it read or made.
function describeCall(c) {
  let a = {};
  try { a = JSON.parse(c.args || '{}'); } catch (e) {}
  const r = c.result || '';
  const firstLine = r.split('\n')[0];
  switch (c.tool) {
    case 'read_paper': {
      const from = a.start_page || 1, to = from + Math.min(5, Math.max(1, a.num_pages || 3)) - 1;  // read_paper returns at most 5 pages
      return `Read ${linkify('paper:' + a.paper_id)} <i>${esc(firstLine.replace(/\s*\(paper:\d+.*$/, ''))}</i>, pages ${from}–${to}`;
    }
    case 'save_paper_notes': {
      const m = r.match(/Saved notes to (.+)\.$/);
      return `Saved notes on ${linkify('paper:' + a.paper_id)}` + (m ? ` → ${fileLink(m[1])}` : ` <span style="color:#b00">${esc(firstLine)}</span>`);
    }
    case 'create_thread': return `Started thread <b>${esc(a.title)}</b>: ${linkify(r)}<div class="txt">${linkify(a.body)}</div>`;
    case 'post_reply': return `Replied in thread ${a.thread_id}: ${linkify(r)}<div class="txt">${linkify(a.body)}</div>`;
    case 'send_dm': return `DM to <b>${esc(a.to)}</b>: ${linkify(r)}<div class="txt">${linkify(a.body)}</div>`;
    case 'save_insight': case 'write_proposal': return `${c.tool === 'save_insight' ? 'Saved insight' : 'Wrote proposal'} <b>${esc(a.title)}</b>: ${linkify(r)}`;
    case 'record_experiment': return `Ran experiment in ${esc(a.directory)}: ${linkify(firstLine)}<div class="txt">${esc(a.hypothesis)}</div>`;
    case 'search_papers': return `Searched arXiv for <b>${esc(a.query)}</b>`;
    case 'fetch_openalex_works': return `Fetched works from OpenAlex (${esc([a.search, a.filter].filter(Boolean).join('; '))}): ${esc(firstLine)}`;
    case 'download_paper': return `Downloaded ${esc(a.arxiv_id || a.pdf_url)}: ${linkify(r)}`;
    case 'read_reference': return `Looked up ${linkify(a.ref || '')}`;
    case 'shell': return `Ran <code>${esc(a.command)}</code>`;
    case 'write_file': case 'edit_file': case 'read_file': return `${c.tool.replace('_', ' ')} <code>${esc(a.path || a.file_path || '')}</code>`;
    default: return `${esc(c.tool)} <code>${esc(JSON.stringify(a).slice(0, 160))}</code>`;
  }
}

async function openActivity(id) {
  const a = await api('/api/activities/' + id);
  const made = (TL?.nodes || []).filter(n => n.activity === id && n.kind !== 'activity' && n.kind !== 'update');
  const mc = a.model_calls;
  show(`<h3>Activity #${a.id} · ${esc(a.agent_id)}</h3>
    <p class="meta">${a.status} · trigger ${a.trigger} · ${a.started_at} → ${a.ended_at || 'running'} · ${mc.n} model calls, ${Math.round(mc.seconds || 0)} s, ${mc.output_tokens || 0} output tokens · prompt ${a.prompt_hash}</p>
    ${a.error ? `<p style="color:#b00">${esc(a.error)}</p>` : ''}
    <h4>Public update</h4><div class="card t-update"><pre>${linkify(a.public_update || '(none)')}</pre></div>
    <h4>Produced</h4>${made.map(n => `<div class="chip" style="cursor:pointer" onclick="openNode('${esc(n.key)}')">${n.kind}: ${esc(n.title || n.key)}</div>`).join(' ') || '<span class="meta">nothing saved</span>'}
    ${plots(made.flatMap(n => n.images || []))}
    <h4>What it did</h4>` +
    a.tool_calls.map((c, i) => `<div class="card t-tool_call"><span class="meta">${i + 1}. ${hhmm(c.started_at)}</span> ${describeCall(c)}
      <details><summary class="meta">arguments and result</summary><pre>${esc(c.args)}</pre><pre>${linkify(c.result || '(no result)')}</pre></details></div>`).join(''));
}

function focusNode(key) {
  const svg = $('#tlsvg');
  if (!svg) return;
  svg.classList.toggle('focus', !!key);
  document.querySelectorAll('.node.lit').forEach(el => el.classList.remove('lit'));
  svg.querySelectorAll('.edge').forEach(p => {
    const on = key && (p.dataset.from === key || p.dataset.to === key);
    p.classList.toggle('on', !!on);
    if (on) [p.dataset.from, p.dataset.to].forEach(k => document.querySelector(`.node[data-key="${CSS.escape(k)}"]`)?.classList.add('lit'));
  });
}

function drawLinks() {
  const box = $('#tl'), svg = $('#tlsvg');
  if (!box || !TL) return;
  const B = box.getBoundingClientRect();
  svg.setAttribute('width', box.scrollWidth);
  svg.setAttribute('height', box.scrollHeight);
  const rect = (k) => {
    const el = box.querySelector(`.node[data-key="${CSS.escape(k)}"]`);
    if (!el) return null;
    const q = el.getBoundingClientRect();
    return {x: q.left - B.left, y: q.top - B.top, w: q.width, h: q.height};
  };
  let out = '<defs>' + Object.entries({...KIND, grey: '#888'}).map(([k, c]) =>
    `<marker id="m-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('') + '</defs>';

  // Activity bars: a strip left of each agent column, from the activity card to the last item it produced.
  for (const a of TL.nodes.filter(n => n.kind === 'activity')) {
    const r0 = rect(a.key);
    if (!r0) continue;
    const end = a.ended_at || '9999';
    const inside = TL.nodes.filter(n => n.agent === a.agent && n.kind !== 'activity' && n.time >= a.time && n.time <= end).map(n => rect(n.key)).filter(Boolean);
    const bottom = Math.max(r0.y + r0.h, ...inside.map(r => r.y + r.h));
    out += `<rect class="band" x="${r0.x - 9}" y="${r0.y}" width="4" height="${bottom - r0.y}" rx="2" fill="${STATUS[a.status] || '#999'}"/>`;
  }

  for (const e of TL.edges) {
    const a = rect(e.from), b = rect(e.to);
    if (!a || !b) continue;
    const target = TL.nodes.find(n => n.key === e.to);
    const color = e.type === 'ref' ? KIND[target.kind] : '#888';
    const marker = e.type === 'ref' ? target.kind : 'grey';
    let d;
    if (Math.abs(a.x - b.x) < 5) {
      // Same column: loop out to the right side of the cards.
      const x = a.x + a.w, bend = 30 + Math.min(80, (a.y - b.y) / 12);
      d = `M${x},${a.y + 14} C${x + bend},${a.y + 14} ${x + bend},${b.y + b.h - 10} ${x},${b.y + b.h - 10}`;
    } else {
      const left = b.x < a.x;
      const x1 = left ? a.x : a.x + a.w, x2 = left ? b.x + b.w : b.x;
      const y1 = a.y + 14, y2 = b.y + Math.min(b.h / 2, 20), mid = (x1 + x2) / 2;
      d = `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`;
    }
    out += `<path class="edge" data-from="${esc(e.from)}" data-to="${esc(e.to)}" d="${d}" stroke="${color}"
      ${e.type === 'ref' ? '' : 'stroke-dasharray="5 4"'} marker-end="url(#m-${marker})"/>`;
  }
  svg.innerHTML = out;
}
window.addEventListener('resize', () => tab === 'timeline' && drawLinks());

function summarize(e) {
  const p = e.payload;
  switch (e.type) {
    case 'update': case 'post': return p.body;
    case 'dm': return `to ${p.to}: ${p.body}`;
    case 'tool_call': return `${p.tool}(${p.args})`;
    case 'tool_result': return `${p.tool} → ${p.result}`;
    case 'insight': case 'proposal': return `${e.type}:${p.id} "${p.title}" revision ${p.revision}`;
    case 'experiment': return `experiment:${p.id} exit ${p.exit_code}: ${p.hypothesis}\n${p.results}`;
    default: return JSON.stringify(p);
  }
}

async function openThread(id) {
  const t = await api('/api/threads/' + id);
  show(`<h3>${esc(t.thread.title)}</h3>` + t.messages.map(m => `<div class="card"><div class="meta">message:${m.id} · ${m.author} · ${m.created_at}</div><pre>${linkify(m.body)}</pre></div>`).join(''));
}
async function openArtifact(id) {
  const a = await api('/api/artifacts/' + id);
  let html = `<h3>${a.kind}:${a.id} ${esc(a.title)}</h3>`;
  for (const v of a.versions.slice().reverse()) {
    html += `<div class="card"><div class="meta">revision ${v.revision} by ${v.author} · ${v.created_at} · references ${linkify(v.refs)}
      ${v.revision > 1 ? `<button onclick="diff(${a.id}, ${v.revision - 1}, ${v.revision})">diff vs ${v.revision - 1}</button>` : ''}</div><pre>${linkify(v.body)}</pre></div>`;
  }
  show(html);
}
async function diff(id, a, b) { const d = await api(`/api/artifacts/${id}/diff?a=${a}&b=${b}`); show(`<pre>${esc(d.diff)}</pre>`); }
async function doSearch() {
  const r = await api('/api/search?q=' + encodeURIComponent($('#sq').value));
  $('#sr').innerHTML = r.map(h => `<div>${linkify(h.ref.replace('notes:', 'paper:'))} ${esc(h.title)} <span class="meta">${esc(h.snippet)}</span></div>`).join('');
}
async function loadConfig() { $('#ct').value = (await api('/api/file?path=' + encodeURIComponent($('#cf').value))).text; }
async function saveConfig() {
  await api('/api/config', {method: 'PUT', headers: {'content-type': 'application/json'}, body: JSON.stringify({path: $('#cf').value, text: $('#ct').value})});
  alert('saved');
}

async function render() {
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === tab));
  if (tab !== 'runs') await loadRuns();
  $('#main').classList.toggle('wide', tab === 'timeline');
  $('#main').innerHTML = await views[tab]();
  if (tab === 'timeline') drawLinks();
  if (tab === 'config') loadConfig();
}

// Live updates: re-render the current view when new events arrive (not while editing config).
let source;
function connect() {
source = new EventSource('/api/events/stream?after=' + (window.startEventId || 0));
let pending = null;
source.onmessage = (m) => {
  window.lastEventId = Math.max(window.lastEventId || 0, JSON.parse(m.data).id);
  if (tab === 'config' || $('#modal').style.display === 'block') return;
  clearTimeout(pending);
  pending = setTimeout(render, 500);
};
}
api('/api/events?newest=1').then(e => { window.startEventId = e.length ? e[0].id : 0; connect(); });
render();
</script>
